<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuViGaN Persistence Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="logo-container">
                <div class="logo-cube"></div>
                <h1>XuViGaN <span class="neon">PERSISTENCE</span></h1>
            </div>

            <div class="header-center">
                <!-- 3D Data Visualization -->
                <div id="data-cube-container">
                    <div class="cube-face front">Projects</div>
                    <div class="cube-face back">Sessions</div>
                    <div class="cube-face right">Actions</div>
                    <div class="cube-face left">Errors</div>
                    <div class="cube-face top">Files</div>
                    <div class="cube-face bottom">Live</div>
                </div>

                <div id="hologram-stats">
                    <div class="holo-stat">
                        <div class="holo-value" id="stat-projects">0</div>
                        <div class="holo-label">Projects</div>
                    </div>
                    <div class="holo-stat">
                        <div class="holo-value" id="stat-sessions">0</div>
                        <div class="holo-label">Sessions</div>
                    </div>
                    <div class="holo-stat">
                        <div class="holo-value" id="stat-actions">0</div>
                        <div class="holo-label">Actions</div>
                    </div>
                    <div class="holo-stat">
                        <div class="holo-value" id="stat-errors">0</div>
                        <div class="holo-label">Errors</div>
                    </div>
                    <div class="holo-stat live">
                        <div class="holo-pulse"></div>
                        <div class="holo-label">LIVE</div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div id="controls">
                <button id="btn-export-png" title="Export PNG">📸</button>
                <button id="btn-export-json" title="Export JSON">💾</button>
                <button id="btn-theme" title="Toggle Theme">🎨</button>
            </div>
        </header>

        <!-- Adaptive Interface - changes based on data -->
        <div id="adaptive-interface">
            <div id="interface-selector">
                <button class="interface-btn active" data-interface="graph">3D Graph</button>
                <button class="interface-btn" data-interface="matrix">Matrix</button>
                <button class="interface-btn" data-interface="wave">Wave</button>
                <button class="interface-btn" data-interface="cloud">Cloud</button>
            </div>

            <div id="search-container">
                <input type="text" id="search-box" placeholder="🔍 Search nodes..." />
                <button id="btn-reset" title="Reset View">⟲</button>
            </div>
        </div>

        <main>
            <div id="visualization-container">
                <!-- 3D Graph View -->
                <div id="graph-view" class="visualization active">
                    <div id="three-container"></div>
                    <div id="graph-overlay"></div>
                    <div id="tooltip"></div>

                    <!-- Minimap -->
                    <div id="minimap-container">
                        <svg id="minimap"></svg>
                        <div id="minimap-viewport"></div>
                    </div>
                </div>

                <!-- Matrix View -->
                <div id="matrix-view" class="visualization">
                    <div id="matrix-grid"></div>
                </div>

                <!-- Wave View -->
                <div id="wave-view" class="visualization">
                    <canvas id="wave-canvas"></canvas>
                </div>

                <!-- Cloud View -->
                <div id="cloud-view" class="visualization">
                    <div id="cloud-container"></div>
                </div>
            </div>

            <div id="sidebar">
                <div class="panel">
                    <h3>Live Events</h3>
                    <div id="events-feed"></div>
                </div>
                <div class="panel">
                    <h3>Node Info</h3>
                    <div id="node-info">
                        <p class="placeholder">Select a node to view details</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Theme stylesheets (lazy loaded) -->
    <link id="theme-stylesheet" rel="stylesheet" href="themes/cyberpunk.css" disabled>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="live.js"></script>
</body>
</html>
