<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XuViGaN Persistence · Liquid Nodes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2333e0ff'/></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="lib/d3.v7.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>XuViGaN <span class="neon">PERSISTENCE</span></h1>

            <div id="stats">
                <div class="stat"><span class="label">Projects</span><span class="value" id="stat-projects">0</span></div>
                <div class="stat"><span class="label">Sessions</span><span class="value" id="stat-sessions">0</span></div>
                <div class="stat"><span class="label">Actions</span><span class="value" id="stat-actions">0</span></div>
                <div class="stat"><span class="label">Errors</span><span class="value" id="stat-errors">0</span></div>
                <div class="stat live"><span class="pulse"></span> LIVE</div>
            </div>

            <div id="controls">
                <button id="btn-export-png" title="Export PNG">📸</button>
                <button id="btn-export-json" title="Export JSON">💾</button>
                <button id="btn-reset" title="Reset View">⟲</button>
            </div>
        </header>

        <div id="search-container">
            <input type="text" id="search-box" placeholder="🔍 Search nodes..." />
        </div>

        <main>
            <div id="graph-container">
                <svg id="graph"></svg>
                <div id="tooltip"></div>
            </div>

            <div id="sidebar">
                <div class="panel">
                    <h3>Live Events</h3>
                    <div id="events-feed"></div>
                </div>
                <div class="panel">
                    <h3>Node Info</h3>
                    <div id="node-info">
                        <p class="placeholder">Select a node to view details</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="lib/html2canvas.min.js"></script>
    <script src="live.js"></script>
</body>
</html>
